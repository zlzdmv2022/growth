# 开篇词<br/>一千个问题 → 28 个设计模式

## 🎯 核心命题
- Agent 架构 = **不确定性下的有限资源分配**
- The model spends; the harness budgets
- 模型负责花，Harness 负责预算
- 缺的不是工具，是**设计语言**

## 🔍 起点：1000+ 真实工程问题
- 来源：CC 工程化实战专栏 587 留言 + 539 回复、行动营、群聊、知识星球
- 典型痛点
  - Claude Code 一进公司仓库就乱
  - SubAgent 越多，决策反而越差
  - CLAUDE.md 规则写了还是会忘
  - MCP 工具越多越容易选错
  - 代码审计 Agent 重复踩坑
  - 长任务跑偏、越权
- 团队缺的不是工具（demo 都能跑）
- 缺的是设计语言（问题语言）
  - 类比后端：事务边界/缓存/幂等/限流/索引

## 💡 核心观点
### Agent 的价值 = 沉淀经验
- 而非今天有多聪明
- 判断标准
  - 记住踩过的坑？
  - 失败写进失败日记？
  - 成功沉淀成 Skill？
  - 处理 100 个 PR 后更懂仓库？
- 否则 = 每天重新入职的聪明新人
- 目标：会成长、会沉淀、会被治理、会变老练

### 范式变化（不是工具升级）
- 传统软件：控制流写死在代码里
- Agent 系统：控制流运行时由模型决定
- 工程师的新工作：**设计决策边界**
- 资源悖论 ⚠️
  - 200K token → 可能只是更乱
  - 40 个工具 → 混乱迷失
  - 8 个 SubAgent → 8 份无法合并的噪声
  - 完全自主 → 更快扩散错误

### 第三代模式语言
- 第一代：GoF 23 模式 → 对象复杂度
- 第二代：分布式模式 → 网络/状态/失败
- **第三代：Agent 设计模式**
  - 运行时决策
  - 上下文注意力
  - 工具副作用
  - 经验累积
  - 多 Agent 协作
  - 治理边界

## 📐 双轴正交框架（核心坐标系）
### Y 轴：认知功能 WHAT（7 个）
- 感知：看见世界（入口）
- 记忆：跨时间保存状态
- 推理：做判断决策
- 行动：改变外部世界
- 反思：审计决策
- 协作：跨空间分工
- 治理：动作出去前的闸门

### X 轴：执行拓扑 HOW（6 种）
- 链式：一步步走
- 并行：多路同时看
- 路由：多条路里选
- 循环：试了再改
- 层级：主拆给子
- 编排：统筹协调

### 用法
- 先问：解决哪类认知问题？
- 再问：能力该怎么编排？
- 28 个模式 → 可定位/比较/组合/复盘的工程零件

## 🧩 28 个模式 = 稀缺资源分配
- 上下文分诊 → 注意力
- 语义压缩 → 有损压缩（错误堆栈不能压）
- 工具调度 → 工具/风险/状态
- 生成-批评 → 生成评估不对称（critic 约束 generator）
- 经验回放 → 经验变上下文
- 审批门控 → 信任分级
- 共同点：感知分配注意力，治理分配信任

## 📚 课程结构（9 模块 44 篇）
- 01 范式觉醒：双轴框架 + 逆向五步法
- 02 感知：分诊/压缩/渐进发现/多模态融合
- 03 记忆：短期上下文+长期记忆+失败经验+进度
- 04 推理：思维链/复杂度路由/并行探索/迭代假设
- 05 行动：工具调度/规划执行/提示链/护栏三明治
- 06 反思：Generator-Critic/Skill 包/经验回放/Self-Heal
- 07 协作：层级委派/扇出聚合/对抗评审/交接链
- 08 治理：审批门/爆炸半径/渐进承诺/可观测性
- 09 组合：模式选型卡 + 六步选型法
- 代码仓库
  - agent-design-patterns（模式案例）
  - designing-ai-agents（0→1 构建 Coding Agent）
- ADPS 社区：adpsagent.com

## 🏆 学完获得三种能力
- 看穿系统
  - 从"模型不够强"到精准归因
  - 上下文？记忆？推理档位？工具？反思？治理？
- 组合模式
  - 金融研报 Agent 实例
  - 多模态融合 + RAG + 复杂度路由 + 生成批评 + 审批门控 + 可观测性
  - 单个模式是零件，组合才是架构
- 设计成长机制
  - 失败日记 / 技能包 / 经验回放 / 进度追踪 / 交接产物
  - 第 1 天的聪明 → 第 365 天的老练

## 💬 留言区精华
- Agent 产品架构
  - 用户 → Agent Runtime → Skills → Tools → Data
  - 五大模块：感知/推理/执行/治理/记忆
- 组织演化三阶段
  - S1：AI 个人加速器（孤岛）
  - S2：共享 context + 治理（个人×3-5，团队×2-3）
  - S3：人 + agent 混合编制（2-3 人 + 5-10 agent）
- 找 bug 比写无 bug 代码容易 → 主动给 debug 加结构
- RAG 没有过时（企业知识库场景）

## 🌟 一句话总结
- 软件工程的稳定主题：**把偶然成功变成可重复成功**
- 找出"刚好"背后的结构：命名它、约束它、复用它、组合它
- 对联纲领
  - 记失败、存经验，价值始聚
  - 知进退、懂组合，系统方生
